defaults:
- _self_
- actor: residual_diffusion

seed: null
torch_deterministic: false
gpu_id: 0
headless: true
reset_on_failure: false
reset_every_iteration: true
reset_on_success: true
sample_perturbations: false
eval_interval: 5
eval_first: true
checkpoint_interval: -1
truncation_as_done: true
base_policy:
  wandb_id: null  # If starting with a base policy from a WandB run (typical)
  wt_type: best_success_rate
  wt_path: null  # If starting with a base policy stored on file 

observation_type: state

total_timesteps: 1_000_000_000

num_envs: 1024
num_minibatches: 1
update_epochs: 50
num_env_steps: 700
data_collection_steps: ${num_env_steps}

env:
  randomness: low
  task: one_leg
  stiffness: 1000.0  # Arm joint PD stiffness (Nm/rad) of the diff-IK position drive; paper setting 1000
  damping: 200.0  # Arm joint PD damping; paper setting 200

actor:
  residual_policy:
    pretrained_wts: null
    pretrained_load_optim: true  # false: load only the weights from pretrained_wts, start a fresh optimizer and LR schedule
    pretrained_logstd: null  # set the log std after loading pretrained_wts, whose own value replaces init_logstd; null keeps it
    init_logstd: -1.0
    learn_std: false

# Learning rates
learning_rate_actor: 3e-4
optimizer_betas_actor: [0.9, 0.999]

learning_rate_critic: 5e-3
lr_scheduler:
  name: cosine
  actor_warmup_steps: 5
  critic_warmup_steps: 0

# Residual specific arguments
residual_l1: 0.0
residual_l2: 0.0
# Smoothness loss on the policy mean: mean squared second difference over three consecutive
# steps of the target (base action + residual mean; position and rotation, not the gripper),
# in residual units (normalized action / action_scale). 0 disables it (paper setting).
residual_smooth: 0.0

# Algorithm specific arguments
discount: 0.999
gae_lambda: 0.95
norm_adv: true
normalize_reward: true
clip_reward: 5.0
clip_coef: 0.2
clip_vloss: false
ent_coef: 0.0
vf_coef: 1.0
max_grad_norm: 1.0
target_kl: 0.1
n_iterations_train_only_value: 0

base_bc:
  train_bc: false

# Penalty on excessive force: reward -= coef * max(0, max_j |tau_j| / tau_limit_j - threshold)
# over the 7 arm joints. coef 0 disables it (paper setting); the torque diagnostics are logged either way.
safety:
  torque_penalty_coef: 0.0
  torque_threshold: 0.5
  # Fail an episode (no success reward, done) once max_j |tau_j| / tau_limit_j exceeds this
  # before success. null disables it (paper setting).
  terminate_torque_ratio: null
  # Success also requires the inserted part to twist at least this many turns about its long
  # axis while within 3 cm of an assembled position; otherwise the episode fails (no success
  # reward, done). Screwing the leg in takes ~1.19 turns, forcing it in ~0.26 (one_leg).
  # null disables it (paper setting).
  min_insert_twist_turns: null
  # The same, but only steps where the gripper holds the part (width 2-3.6 cm) count, so turning
  # it by pushing with the fingertips doesn't. Demos twist >= 0.93 turns while held. null disables it.
  min_held_twist_turns: null
  # Success also requires the base part (table top) to move at most this far horizontally (peak,
  # mm) after the inserted part first comes within 3 cm of an assembled position. Demo peaks:
  # median 5 mm, 90% <= 12 mm, max 35 mm. The push into the fixture before that is allowed. null disables it.
  max_insert_base_move_mm: null

# Calculate the batch size as the data collection steps times the number of environments
batch_size: ${eval:'${data_collection_steps} * ${num_envs}'}
minibatch_size: ${eval:'${batch_size} // ${num_minibatches}'}
num_iterations: ${eval:'${total_timesteps} // ${batch_size}'}

control:
  controller: diffik  # diffik
  control_mode: pos
  act_rot_repr: rot_6d

wandb:
  project: ${env.task}-residual-rl
  mode: online
  entity: null
  name: null  # Run name for WandB and models/<name>; null generates <timestamp>__<actor>_ppo__<seed>
  notes: null
  continue_run_id: null

debug: false
